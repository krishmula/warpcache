[project]
name = "warpcache"
version = "0.0.0"
description = "CUDA decode attention over INT8 and FP16 paged KV caches, exploring quantization and GPU parallelism for LLM inference"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "torch>=2.5"]

[dependency-groups]
dev = ["pytest>=8"]
capture = ["transformers>=4.56", "accelerate"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
